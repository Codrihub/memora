name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # Known-vulnerability check for the Rust and npm dependency trees. A
  # vulnerability advisory fails the job; unmaintained, unsound and yanked
  # warnings are printed but do not fail it. Advisories that are reviewed and
  # do not apply are listed with a reason in .cargo/audit.toml.
  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install cargo-audit
        uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-audit

      - name: cargo audit
        run: cargo audit

      - name: npm audit (web UI, shipped dependencies)
        working-directory: web
        run: npm audit --omit=dev --audit-level=moderate

  test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Build
        run: cargo build --workspace --release

      - name: Test
        run: cargo test --workspace

  # The same MSVC build the release ships (static C runtime), plus the test
  # suite, so a Windows break shows up before a tag is pushed.
  windows:
    name: Build and test (Windows)
    runs-on: windows-latest
    env:
      RUSTFLAGS: -C target-feature=+crt-static
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch
        with:
          toolchain: stable
          targets: x86_64-pc-windows-msvc
          components: clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: x86_64-pc-windows-msvc

      - name: Clippy
        run: cargo clippy --workspace --all-targets --target x86_64-pc-windows-msvc -- -D warnings

      - name: Test
        run: cargo test --workspace --no-fail-fast --target x86_64-pc-windows-msvc

      - name: Smoke test the server
        shell: pwsh
        run: |
          cargo build --release --locked --target x86_64-pc-windows-msvc --bin memora --bin memora-cli
          $bin = "target/x86_64-pc-windows-msvc/release"
          $env:MEMORA_STATE = "$env:RUNNER_TEMP\memora-state"
          $env:MEMORA_VAULT = "$env:RUNNER_TEMP\memora-vault"
          $env:MEMORA_VAULT_AUTO = "true"
          $env:MEMORA_ASSETS = "crates/http/assets"
          $env:MEMORA_PORT = "18400"
          $p = Start-Process -FilePath "$bin/memora.exe" -PassThru -NoNewWindow -RedirectStandardOutput server.log -RedirectStandardError server.err
          $ok = $false
          foreach ($i in 1..30) {
            try { Invoke-WebRequest -UseBasicParsing http://127.0.0.1:18400/healthz | Out-Null; $ok = $true; break } catch { Start-Sleep 1 }
          }
          & "$bin/memora-cli.exe" --state $env:MEMORA_STATE status
          Stop-Process -Id $p.Id -Force
          Get-Content server.log, server.err -ErrorAction SilentlyContinue
          if (-not $ok) { throw "memora.exe did not answer /healthz" }
          if (-not (Test-Path "$env:MEMORA_STATE\memora.db")) { throw "no state database" }

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          push: false
          tags: memora:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  installer:
    name: Installer lint and dry run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: shellcheck
        run: shellcheck -s sh scripts/install.sh docker/entrypoint.sh docker/setup-wrapper.sh

      - name: install.sh --dry-run
        run: |
          mkdir -p /tmp/pkg/assets
          printf '#!/bin/sh\n' > /tmp/pkg/memora
          cp /tmp/pkg/memora /tmp/pkg/memora-cli
          sh scripts/install.sh --from-dir /tmp/pkg --version 0.0.0-ci --dry-run
          sh scripts/install.sh --from-dir /tmp/pkg --version 0.0.0-ci \
            --prefix /tmp/root/usr --data-dir /tmp/root/var --no-systemd
          test -x /tmp/root/usr/bin/memora
          test -f /tmp/root/usr/share/memora/install.sh
